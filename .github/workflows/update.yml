name: Update Nifty 100 MWD Screener

on:

  schedule:

    # 5:00 AM IST = 11:30 PM UTC previous day
    - cron: "30 23 * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Run MWD Screener

        run: |

          python mwd_screener.py


      - name: Commit Updated HTML

        run: |

          git config --global user.name "GitHub Actions"

          git config --global user.email "actions@github.com"

          git add docs/index.html

          git diff --quiet && git diff --staged --quiet || git commit -m "Daily Nifty 100 MWD Update"

          git push
